<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
</head>
<body>
  <h1>Calculadora Node.js</h1>
  <form id="calcForm">
    <input type="number" id="a" placeholder="Número A" required>
    <input type="number" id="b" placeholder="Número B" required>
    <select id="op" required>
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
    </select>
    <button type="submit">Calcular</button>
  </form>
  <p>Resultado: <span id="result">0</span></p>

  <script>
    const form = document.getElementById('calcForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const a = Number(document.getElementById('a').value);
      const b = Number(document.getElementById('b').value);
      const op = document.getElementById('op').value;
      const res = await fetch('/calc', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({a,b,op})
      });
      const data = await res.json();
      document.getElementById('result').innerText = data.result ?? data.error;
    });
  </script>
</body>
</html>
